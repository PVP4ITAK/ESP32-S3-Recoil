name: Build ESP32-S3 N16R8 touch profiles
on:
  workflow_dispatch:
  push:
    paths:
      - 'TouchProfiles/**'
      - '.github/workflows/build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install stable Arduino ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12
      - name: Compile for ESP32-S3 N16R8 and export bins
        run: |
          mkdir -p dist
          arduino-cli compile --clean --export-binaries \
            --fqbn 'esp32:esp32:esp32s3:USBMode=default,CDCOnBoot=default,FlashSize=16M,FlashMode=qio,PSRAM=opi,PartitionScheme=huge_app' \
            --output-dir dist TouchProfiles
          ls -lah dist
      - name: Package one flash-at-0x0 image if core did not export one
        run: |
          python3 -m pip install 'esptool==4.9.0'
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          d=Path('dist')
          merged=list(d.glob('*.merged.bin'))
          if merged:
              merged[0].rename(d/'ESP32S3_N16R8_FLASH_0x0.bin')
          else:
              apps=[p for p in d.glob('*.bin') if not any(x in p.name for x in ['bootloader','partitions','merged'])]
              boots=list(d.glob('*.bootloader.bin'))
              parts=list(d.glob('*.partitions.bin'))
              if len(apps)!=1 or len(boots)!=1 or len(parts)!=1:
                  raise RuntimeError(f'Expected exactly 1 app, bootloader and partitions: {list(d.glob("*.bin"))}')
              subprocess.run(['python3','-m','esptool','--chip','esp32s3','merge_bin',
                 '-o',str(d/'ESP32S3_N16R8_FLASH_0x0.bin'),
                 '--flash_mode','qio','--flash_freq','80m','--flash_size','16MB',
                 '0x0',str(boots[0]),'0x8000',str(parts[0]),'0x10000',str(apps[0])],check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ESP32S3-N16R8-TouchProfiles-BIN
          path: dist/*.bin
          if-no-files-found: error
          retention-days: 14
