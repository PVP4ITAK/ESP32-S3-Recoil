name: Build VANTA Vision Pad7 APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'VantaPad_Neural_UI_Source.zip'
      - '.github/workflows/build-vanta-ui.yml'
permissions:
  contents: read
jobs:
  android:
    name: VANTA Android UI APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack Android project
        run: |
          mkdir -p vanta_project
          unzip -oq VantaPad_Neural_UI_Source.zip -d vanta_project
          test -f vanta_project/app/src/main/AndroidManifest.xml
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK components
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        run: gradle -p vanta_project assembleDebug --no-daemon --stacktrace
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: VantaPad-Vision-APK
          path: vanta_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
